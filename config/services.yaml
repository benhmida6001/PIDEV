parameters:
    gemini_api_key: '%env(GEMINI_API_KEY)%'
    uploads_directory: '%kernel.project_dir%/public/uploads/materiels'
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\ImageComparisonService:
        arguments:
            $apiKey: '%gemini_api_key%'